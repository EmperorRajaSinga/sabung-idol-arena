name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - zip-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        id: tests
        run: npm test
        continue-on-error: true

      - name: Build production assets
        run: npm run build

      - name: Block deployment when tests fail
        if: steps.tests.outcome != 'success'
        run: |
          echo "The test suite failed. Production deployment is blocked."
          exit 1

      - name: Deploy to Cloudflare Workers
        if: steps.tests.outcome == 'success'
        run: npx --yes wrangler@4.156.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
