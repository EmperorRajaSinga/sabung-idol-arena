name: Validate production build

on:
  push:
    branches:
      - zip-update
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Deployment ownership
        run: echo "Cloudflare Workers Builds handles production deployment from the connected zip-update branch."
